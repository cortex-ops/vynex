<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linux AI Overlay</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Heroicons CDN -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
    
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-gray-200 flex flex-col h-screen p-4">

    <div class="flex-1 flex flex-col max-w-3xl w-full mx-auto bg-gray-800 rounded-xl shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <div class="bg-gray-900 p-4 flex justify-between items-center border-b border-gray-700">
            <h1 class="text-xl font-bold">AI Overlay</h1>
            <!-- You could add minimize/close buttons here for a real app feel -->
            <button id="toggle-overlay" class="text-gray-400 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
            </button>
        </div>

        <!-- Chat Messages Container -->
        <div id="chat-container" class="flex-1 p-6 space-y-4 overflow-y-auto chat-container">
            <!-- Initial Bot Message -->
            <div class="flex items-start space-x-3">
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-indigo-600 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M12 21v-1" />
                    </svg>
                </div>
                <div class="bg-gray-700 p-3 rounded-lg rounded-tl-none shadow-md">
                    <p class="text-sm">Hello! I'm your Linux AI assistant. Ask me anything or upload a file to get started.</p>
                </div>
            </div>

            <!-- Example User Message -->
            <!--
            <div class="flex items-start space-x-3 justify-end">
                <div class="bg-indigo-600 p-3 rounded-lg rounded-br-none shadow-md">
                    <p class="text-sm">What's the weather today?</p>
                </div>
                <div class="flex-shrink-0 h-10 w-10 rounded-full bg-gray-600 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
            </div>
            -->
            
        </div>

        <!-- File Upload Preview -->
        <div id="file-preview-container" class="p-4 border-t border-gray-700 bg-gray-800 hidden flex-col items-center">
            <p class="text-sm font-medium mb-2">Attached File:</p>
            <div class="bg-gray-700 p-2 rounded-lg flex items-center">
                <span id="file-name" class="text-sm text-gray-300"></span>
                <button id="remove-file-btn" class="ml-2 text-gray-400 hover:text-red-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-gray-900 p-4 border-t border-gray-700">
            <div class="flex items-center space-x-3">
                <!-- File Upload Button -->
                <input type="file" id="file-input" class="hidden" />
                <button id="upload-btn" class="p-2 text-gray-400 hover:text-white rounded-full hover:bg-gray-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.414a4 4 0 00-5.656-5.656l-6.415 6.415a6 6 0 108.486 8.486L20.5 13" />
                    </svg>
                </button>

                <!-- Text Input -->
                <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 bg-gray-700 border border-gray-600 rounded-full py-2 px-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">

                <!-- Send Button -->
                <button id="send-btn" class="p-2 text-white bg-indigo-600 rounded-full hover:bg-indigo-500 transition-colors focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" transform="rotate(90)">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
